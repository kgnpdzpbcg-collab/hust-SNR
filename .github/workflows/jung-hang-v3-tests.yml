name: Jung-Hang V3 tests

on:
  push:
    branches:
      - research/jung-hang-faithful-adaptation-v1
    paths:
      - "scripts/jung_hang_models_v3.py"
      - "scripts/compare_jung_hang_v3.py"
      - "tests/test_jung_hang_models_v3.py"
      - ".github/workflows/jung-hang-v3-tests.yml"

jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pytest
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run synthetic smoke test
        run: python scripts/compare_jung_hang_v3.py
      - name: Run unit tests
        run: pytest -q tests/test_jung_hang_models_v3.py
