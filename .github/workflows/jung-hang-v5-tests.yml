name: Jung-Hang V5 paper fidelity checks

on:
  push:
    branches:
      - research/jung-hang-paper-fidelity-v5
    paths:
      - "scripts/jung_hang_models_v5.py"
      - "scripts/jung_hang_optim_v5.py"
      - "scripts/jung_hang_v5_audit.py"
      - "scripts/compare_jung_hang_v5.py"
      - "scripts/jung_hang_cycle_v5.py"
      - "configs/jung_hang_v5_v1.json"
      - "tests/test_jung_hang_models_v5.py"
      - ".github/workflows/jung-hang-v5-tests.yml"
  workflow_dispatch:

jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pytest
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Compile old and V5 modules
        run: |
          python -m py_compile scripts/jung_hang_models_v3.py scripts/jung_hang_models_v4.py scripts/jung_hang_models_v5.py scripts/compare_jung_hang_v5.py scripts/jung_hang_optim_v5.py scripts/jung_hang_v5_audit.py scripts/jung_hang_cycle_v5.py
      - name: Run paper-critical CPU tests
        run: pytest -q tests/test_jung_hang_models_v5.py
